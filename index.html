
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050608">
<title>KAYIP GECE</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #050608;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
}

#menu {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: linear-gradient(#0008, #000e),
    radial-gradient(circle, #303030, #050505);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

#menu h1 {
  font-size: 44px;
  letter-spacing: 7px;
  color: #b90000;
  text-shadow: 0 0 20px red;
}

#menu p {
  margin: 20px;
  color: #aaa;
  font-size: 13px;
}

#start {
  padding: 17px 55px;
  background: #8c0000;
  border: 1px solid #ff3333;
  border-radius: 5px;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

#hud {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

#top {
  position: absolute;
  top: 18px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  text-shadow: 0 2px 5px black;
}

#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  font-size: 22px;
  color: #ddd;
}

#joystick {
  position: absolute;
  bottom: 35px;
  left: 25px;
  width: 125px;
  height: 125px;
  border: 2px solid #ffffff55;
  background: #ffffff13;
  border-radius: 50%;
  pointer-events: auto;
  touch-action: none;
}

#stick {
  position: absolute;
  width: 48px;
  height: 48px;
  background: #ffffff77;
  border: 2px solid white;
  border-radius: 50%;
  left: 36px;
  top: 36px;
}

#look {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 58%;
  height: 75%;
  pointer-events: auto;
  touch-action: none;
}

#buttons {
  position: absolute;
  right: 20px;
  bottom: 35px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  pointer-events: auto;
}

.action {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #111c;
  border: 1px solid #aaa;
  color: white;
  font-size: 11px;
}

#message {
  position: absolute;
  top: 20%;
  width: 100%;
  text-align: center;
  color: #ff3333;
  font-size: 17px;
  text-shadow: 0 0 10px black;
}

#loading {
  color: #aaa;
  margin-top: 20px;
  font-size: 12px;
}

</style>
</head>

<body>

<div id="game"></div>

<div id="menu">
  <h1>KAYIP GECE</h1>
  <p>BU EVDE YALNIZ DEĞİLSİN...</p>
  <button id="start">OYUNA BAŞLA</button>
  <div id="loading">03:00 - Hayatta kalmaya çalış.</div>
</div>

<div id="hud">
  <div id="top">
    <span>03:00 AM</span>
    <span>EL FENERİ: AÇIK</span>
  </div>

  <div id="crosshair">+</div>
  <div id="message"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="look"></div>

  <div id="buttons">
    <button class="action" id="flashlight">FENER</button>
    <button class="action" id="run">KOŞ</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module" src="game.js"></script>

</body>
</html>
